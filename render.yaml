services:
  - type: web
    name: daily-sales-log
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Africa/Lagos

  - type: web
    name: daily-sales-log-fe
    runtime: static
    buildCommand: bun install --frozen-lockfile && bun run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://daily-sales-log.onrender.com
      - key: VITE_BUSINESS_TIMEZONE
        value: Africa/Lagos
