services:
  postgres:
    image: postgres:15
    container_name: daily-sales-log-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: local_sales_password
      POSTGRES_DB: daily_sales_log
    ports:
      - "5434:5432"
    volumes:
      - sales_log_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d daily_sales_log"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sales_log_pgdata:
